
name: KI Daytrader Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install 'yfinance>=0.2.60,<2' 'pandas>=2.2,<3'

      - name: Aktien scannen
        run: python scanner.py

      - name: Bericht speichern
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-report
          path: reports/latest.json
          if-no-files-found: warn
